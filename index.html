<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#24415e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="backend.js"></script></head><body><title>Fieldproxy Accounts Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky project bar + tab rail; each tab is a work surface (filters on top, rows below). Overview leads with what needs attention. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#eef1f4; --ink:#18232e; --muted:#5a6876; --line:#d9e0e6;
  --steel:#24415e; --steel-ink:#ffffff; --beam:#d9580d; --beam-soft:#fdeee4;
  --red:#c42b2b; --red-soft:#fbe9e9; --amber:#9a5c00; --amber-soft:#fdf2dc; --green:#1f7a4a; --green-soft:#e3f4ea; --blue:#2558a8; --blue-soft:#e6eefb;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f161d; --surface:#17212b; --sunk:#121a22; --ink:#e6edf3; --muted:#9aa9b7; --line:#2a3846;
  --steel:#8fb3d6; --steel-ink:#0f161d; --beam:#ff8a3d; --beam-soft:#3a2416;
  --red:#ff7b7b; --red-soft:#3a1c1e; --amber:#f2b552; --amber-soft:#372a12; --green:#5fd394; --green-soft:#16301f; --blue:#8db4ff; --blue-soft:#1a2740; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161d; --surface:#17212b; --sunk:#121a22; --ink:#e6edf3; --muted:#9aa9b7; --line:#2a3846;
  --steel:#8fb3d6; --steel-ink:#0f161d; --beam:#ff8a3d; --beam-soft:#3a2416;
  --red:#ff7b7b; --red-soft:#3a1c1e; --amber:#f2b552; --amber-soft:#372a12; --green:#5fd394; --green-soft:#16301f; --blue:#8db4ff; --blue-soft:#1a2740; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:22px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
.eyebrow{font:600 11.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
code{font-family:var(--mono);font-size:.85em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:12px 0;display:grid;gap:10px}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:22px;height:8px;background:var(--beam);border-radius:1px;flex:none}
.brand h1{font-size:22px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cd{font:600 13px var(--mono);padding:6px 10px;border-radius:6px;background:var(--beam-soft);color:var(--beam);font-variant-numeric:tabular-nums;white-space:nowrap}
.conn{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}
.conn.ok{color:var(--green)}
.acctsel{font:600 14px var(--body);padding:6px 10px;border-radius:6px;max-width:60vw}
.achip{display:inline-block;font:600 11px/1 var(--mono);padding:4px 6px;border-radius:4px;background:var(--beam-soft);color:var(--beam);white-space:nowrap;margin-right:6px;vertical-align:1px}
.hdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.h-green{background:var(--green)}.h-amber{background:var(--amber)}.h-red{background:var(--red)}.h-{background:var(--line)}
.acard{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.acard{grid-template-columns:minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:14px;margin:0}
.kv dt{font:600 11.5px var(--mono);color:var(--muted);text-transform:uppercase;padding-top:3px}
.kv dd{margin:0;overflow-wrap:anywhere}
tr.dim td{color:var(--muted)}
.clamp,td .sub.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}
.acard>div:first-child{align-content:start}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 14.5px var(--body);padding:8px 12px 9px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--beam)}
.tab:focus-visible{outline:2px solid var(--beam);outline-offset:-2px}
.count{font:600 11px/1 var(--mono);background:var(--sunk);color:var(--muted);border-radius:999px;padding:3px 6px}
.count.hot{background:var(--red-soft);color:var(--red)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 64px}
.view{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.view>*{min-width:0}
.head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--beam);outline-offset:0;border-color:var(--beam)}
input[type=search]{width:220px;max-width:100%}
button{font:600 14px var(--body);border-radius:6px;padding:7px 13px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button.primary{background:var(--steel);color:var(--steel-ink);border-color:var(--steel)}
button.ghost{border-color:transparent;background:none;color:var(--steel);padding:4px 8px}
button:focus-visible{outline:2px solid var(--beam);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi b{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi.warn b{color:var(--red)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.ws{display:grid;grid-template-columns:minmax(120px,170px) 1fr auto;gap:10px;align-items:center;font-size:14px}
.track{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .d{background:var(--green)} .track .p{background:var(--blue)} .track .b{background:var(--red)}
.ws span:last-child{font:600 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.alist{display:grid;gap:0}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,auto);gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font-family:inherit;border-radius:0;width:100%}
.arow:first-child{border-top:0}
.arow:hover .t{text-decoration:underline}
.arow .t{min-width:0;overflow-wrap:break-word}
.arow .date{white-space:normal;text-align:right;max-width:11em}
.date{font:600 12px var(--mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.date.late{color:var(--red)}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk);white-space:nowrap;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunk)}
td.code{font:600 12.5px var(--mono);white-space:nowrap;color:var(--steel)}
td.wrap{min-width:240px}
td .sub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
tr.group td{background:var(--sunk);font:600 13px var(--display);letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
select.st{padding:3px 6px;font:600 12px var(--mono);border-radius:999px}

.pill{display:inline-block;font:600 11.5px/1 var(--mono);padding:5px 8px;border-radius:999px;white-space:nowrap}
.s-todo,.s-planned,.s-open,.s-waiting,.s-received{background:var(--sunk);color:var(--muted)}
.s-doing,.s-scheduled,.s-proposed,.s-watching{background:var(--blue-soft);color:var(--blue)}
.s-blocked,.s-needs_reply,.s-late,.s-High{background:var(--red-soft);color:var(--red)}
.s-draft,.s-Medium{background:var(--amber-soft);color:var(--amber)}
.s-done,.s-sent,.s-decided,.s-closed,.s-got,.s-Low{background:var(--green-soft);color:var(--green)}
.s-parked,.s-dropped,.s-cancelled{background:var(--sunk);color:var(--muted);text-decoration:line-through}
.star{color:var(--red);font-weight:700}

.mail{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.mrow:first-child{border-top:0}
.mrow.open{background:var(--sunk)}
.mhead{appearance:none;border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer;display:grid;gap:3px;min-width:0}
.mhead:focus-visible{outline:2px solid var(--beam);outline-offset:3px;border-radius:2px}
.mdir{font:600 12px var(--mono);color:var(--muted)}
.msub{font-weight:600;overflow-wrap:anywhere}
.mnote{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.mnum{font:600 12px var(--mono);color:var(--muted);display:grid;gap:3px;font-variant-numeric:tabular-nums}
.mbody{grid-column:2 / -1;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.6;max-height:520px;overflow:auto}
.mbody blockquote{margin:0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}
.mact{grid-column:2 / -1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font-size:13px;padding:5px 10px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--steel);color:var(--steel-ink);border-color:var(--steel)}

.meet{display:grid;gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:start}
.mcard.past{opacity:.85}
.mday{display:grid;gap:2px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.mday b{font:700 28px/1 var(--display)}
.mday span{font:600 11px var(--mono);color:var(--muted);text-transform:uppercase}
.mcard .body{display:grid;gap:4px;min-width:0}

.feed{display:grid;gap:10px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:6px}
.post .who{display:flex;gap:8px;align-items:center;font-weight:600}
.post img{width:22px;height:22px;border-radius:50%}
.post dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14.5px}
.post dt{font:600 11.5px var(--mono);color:var(--muted);text-transform:uppercase;padding-top:3px}
.post dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.form{display:grid;gap:10px}
.form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted);display:grid;gap:6px}
.banner{border-left:4px solid var(--amber);background:var(--amber-soft);padding:10px 14px;border-radius:0 6px 6px 0}
.banner.err{border-left-color:var(--red);background:var(--red-soft)}

.scrim{position:fixed;inset:0;background:rgb(10 16 22 / .45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);padding:18px;display:grid;gap:14px;box-shadow:0 18px 50px rgb(0 0 0 / .25)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-weight:600;z-index:30}
@media (max-width:640px){
  .mrow{grid-template-columns:1fr}
  .mrow>.mnum{order:-1;grid-auto-flow:column;justify-content:start;gap:10px}
  .mbody,.mact{grid-column:1}
  .mcard{grid-template-columns:64px 1fr}
  .mcard>div:last-child{grid-column:1 / -1}
  .ws{grid-template-columns:1fr auto}
  .ws .track{grid-column:1 / -1;order:3}
}
@media (prefers-reduced-motion:no-preference){.tab,.arow,button{transition:background-color .15s,color .15s,border-color .15s}}
</style>

<div class="bar"><div class="bar-in">
  <div class="bar-top">
    <div class="brand"><span class="brand-mark"></span><h1>Accounts Hub</h1></div>
    <div class="chips"><select id="acct" aria-label="Account" class="acctsel"><option value="all">All accounts</option></select><span class="cd" id="cd" hidden></span><span class="conn" id="conn">Connecting…</span><button class="ghost" id="signout" hidden>Sign out</button></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div></div>

<main id="main">
  <div class="empty" id="boot"><b>Loading the hub…</b><span>Accounts, tasks, mail, meetings, client asks, decisions and risks load from the shared project store.</span></div>
</main>

<script>
(function(){
'use strict';
var TABS=[
  {k:'overview',label:'Overview'},
  {k:'tasks',label:'Tasks'},
  {k:'mail',label:'Mail'},
  {k:'meetings',label:'Meetings'},
  {k:'asks',label:'Waiting on client'},
  {k:'decisions',label:'Decisions'},
  {k:'risks',label:'Risks'},
  {k:'standup',label:'Stand-up'}
];
var COLS=['accounts','tasks','comms','meetings','asks','decisions','risks','updates'];
var ST={
  tasks:[['todo','To do'],['doing','In progress'],['blocked','Blocked'],['done','Done']],
  comms:[['needs_reply','Needs reply'],['draft','Draft, not sent'],['sent','Sent'],['received','Received'],['done','Done']],
  meetings:[['planned','Planned'],['scheduled','Scheduled'],['done','Done'],['cancelled','Cancelled']],
  asks:[['waiting','Waiting'],['late','Late'],['got','Received'],['dropped','Dropped']],
  decisions:[['open','Open'],['proposed','Proposed'],['decided','Decided'],['parked','Parked']],
  risks:[['open','Open'],['watching','Watching'],['closed','Closed']]
};
var FIELDS={
  tasks:[['account','Account','acct'],['id','ID','text'],['title','Task','text'],['workstream','Workstream','text'],['owner','Owner','text'],['start','Start','date'],['due','Due','date'],['depends','Depends on','text'],['status','Status','status'],['note','Notes','area']],
  comms:[['account','Account','acct'],['date','Date','date'],['when','Date / time label','text'],['direction','From → to','text'],['kind','Type','select:email,call,video'],['subject','Subject / summary','text'],['status','Status','status'],['statusNote','Status note','text'],['body','Email text','area']],
  meetings:[['account','Account','acct'],['date','Date','date'],['time','Time','text'],['title','Meeting','text'],['attendees','Attendees','text'],['status','Status','status'],['outcome','Outcome / notes','area'],['notes','Notes file','text']],
  asks:[['account','Account','acct'],['id','ID','text'],['ask','What we need','area'],['who','From','text'],['due','Needed by','text'],['ifLate','If late','text'],['critical','Blocks the build','bool'],['status','Status','status']],
  decisions:[['account','Account','acct'],['id','ID','text'],['decision','Decision','area'],['proposal','Our proposal','area'],['owner','Owner','text'],['needed','Needed by','text'],['status','Status','status'],['outcome','Outcome','area']],
  accounts:[['key','Key (short, no spaces)','text'],['name','Name','text'],['client','Client / company','text'],['what','What we do for them','text'],['tier','Tracking','select:active,watch'],['phase','Phase','text'],['health','Health','select:green,amber,red'],['healthWhy','Health reason','text'],['summary','Where things stand','area'],['nextMilestone','Next milestone','text'],['nextMilestoneDate','Milestone date','date'],['tenant','Tenant','text'],['apps','Apps','text'],['fpTeam','Fieldproxy team','text'],['contactsText','Contacts (one per line: Name — role, org)','area'],['linksText','Links (one per line: label | url or path)','area'],['mailKeys','Mail match (comma-separated domains/addresses)','text']],
  risks:[['account','Account','acct'],['id','ID','text'],['risk','Risk','area'],['impact','Impact','select:High,Medium,Low'],['likelihood','Likelihood','select:High,Medium,Low'],['mitigation','Mitigation','area'],['owner','Owner','text'],['status','Status','status']]
};
var NOUN={accounts:'account',tasks:'task',comms:'email or call',meetings:'meeting',asks:'ask',decisions:'decision',risks:'risk'};

var S={db:null,user:null,me:null,canWrite:true,data:{},loaded:{},tab:'overview',f:{},open:{},err:'',acct:'all'};
COLS.forEach(function(c){S.data[c]=[];});
try{S.f=JSON.parse(localStorage.getItem('hub-f')||'{}')||{};}catch(e){S.f={};}
function saveF(){try{localStorage.setItem('hub-f',JSON.stringify(S.f));}catch(e){}}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function md(s){
  return esc(s).split('\n').map(function(l){
    l=l.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
    return /^&gt;\s?/.test(l)?'<blockquote>'+l.replace(/^&gt;\s?/,'')+'</blockquote>':l;
  }).join('\n').replace(/<\/blockquote>\n<blockquote>/g,'\n');
}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmt(iso){if(!iso||!/^\d{4}-\d\d-\d\d$/.test(iso))return iso||'';var d=new Date(iso+'T12:00:00');return DAY[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()];}
function label(col,v){var o=(ST[col]||[]).find(function(x){return x[0]===v;});return o?o[1]:(v||'—');}
function pill(col,v){return '<span class="pill s-'+esc(v)+'">'+esc(label(col,v))+'</span>';}
function toast(t){var el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove();},2200);}
function late(t){return t.status!=='done'&&t.due&&t.due<today();}
function R(col){var a=S.acct;return (S.data[col]||[]).filter(function(r){return a==='all'||r.account===a;});}
function ACC(k){return (S.data.accounts||[]).find(function(a){return a.key===k;})||{key:k,name:k};}
function accName(k){var a=ACC(k);return a.name||k;}
function chip(r){return S.acct==='all'&&r.account?'<span class="achip">'+esc(accName(r.account))+'</span>':'';}
function activeAccounts(){var o={red:0,amber:1,green:2};return (S.data.accounts||[]).filter(function(a){return a.tier!=='watch';}).sort(function(a,b){return ((o[a.health]!=null?o[a.health]:3)-(o[b.health]!=null?o[b.health]:3))||String(a.name||a.key).localeCompare(String(b.name||b.key));});}

/* ---------- data ---------- */
async function write(col,id,patch){
  if(!S.db){toast('Not connected, so changes can’t be saved.');return false;}
  var body=Object.assign({},patch,{updatedAt:new Date().toISOString()});
  if(S.me)body.updatedBy=S.me;
  try{
    if(id){await S.db.collection(col).doc(id).update(body);}
    else{await S.db.collection(col).add(body);}
    return true;
  }catch(e){
    if(e&&e.code==='invalid_argument'&&id==null){S.canWrite=false;render();}
    toast(e&&e.code==='invalid_argument'?'You have view-only access, so this wasn’t saved.':(e&&e.code==='quota_exceeded'?'The project store is full. Delete old items first.':'Couldn’t save. Try again.'));
    return false;
  }
}

var rerender=null;
function schedule(){if(rerender)return;rerender=requestAnimationFrame(function(){rerender=null;render();});}

async function boot(){
  var snap=document.getElementById('snapshot');
  if(snap){
    try{var sd=JSON.parse(snap.textContent);COLS.forEach(function(c){S.data[c]=(sd.data[c]||[]);S.loaded[c]=true;});}catch(e){}
    S.canWrite=false;S.snapshot=sd&&sd.at;
    var cn=document.getElementById('conn');cn.textContent='Snapshot · '+(sd&&sd.at||'');fillAcct();tick();render();return;
  }
  var conn0=document.getElementById('conn');
  if(!window.HubBackend||!HubBackend.configured()){conn0.textContent='Not set up';S.err='This app isn’t connected to its database yet. Fill in config.js with the Supabase project URL and anon key.';render();return;}
  var u=null;try{u=await HubBackend.session();}catch(e){}
  if(!u){conn0.textContent='Signed out';showLogin();return;}
  if(!(await HubBackend.isMember())){conn0.textContent='No access';showDenied();return;}
  S.db=HubBackend.db;S.user=HubBackend.user;
  var so=document.getElementById('signout');so.hidden=false;so.title='Signed in as '+HubBackend.email();
  if(S.user){try{S.me=await S.user.id();}catch(e){}try{var c=await S.user.can('data.write');if(c===false)S.canWrite=false;}catch(e){}}
  var conn=document.getElementById('conn');
  if(!S.db){conn.textContent='Offline';S.err='Sign in to use the Accounts Hub.';render();return;}
  conn.textContent='Live';conn.className='conn ok';
  COLS.forEach(function(c){
    if(c==='comms')return;
    S.db.collection(c).limit(1000).onSnapshot(function(snap){
      S.data[c]=snap.docs.map(function(d){return Object.assign({_id:d.id},d.data());});
      S.loaded[c]=true;fillAcct();schedule();
    },function(e){S.err='Lost the connection to the project store. Reload the page.';conn.textContent='Disconnected';conn.className='conn';schedule();});
  });
  subComms();subActionable();
  render();
}

var unsubComms=null,commsFor=null;

  if(!S.db||commsFor===S.acct)return;
  if(unsubComms)unsubComms();

}

/* ---------- editor ---------- */
function editor(col,id){
  var rec=id?S.data[col].find(function(r){return r._id===id;}):{};
  if(!rec)return;
  if(!S.canWrite&&!id)return;
  var ro=!S.canWrite;
  var sc=document.createElement('div');sc.className='scrim';
  var h='<form class="sheet" role="dialog" aria-modal="true" aria-label="'+(id?'Edit ':'Add ')+NOUN[col]+'"><div class="sheet-head"><h2>'+(id?(ro?'':'Edit ')+NOUN[col]:'Add '+NOUN[col])+'</h2><button type="button" class="ghost" data-close>Close</button></div><div class="form">';
  if(col==='accounts'&&id){rec=Object.assign({},rec);rec.contactsText=(rec.contacts||[]).map(function(c){return c.name+(c.role?' — '+c.role:'')+(c.org?', '+c.org:'');}).join('\n');rec.linksText=(rec.links||[]).map(function(l){return (l.label||'')+' | '+(l.url_or_path||'');}).join('\n');}
  FIELDS[col].forEach(function(f){
    var k=f[0],v=rec[k]==null?'':rec[k],t=f[2],idf='e_'+k,dis=ro?' disabled':'';
    if(t==='acct'){var cur=v||(S.acct!=='all'?S.acct:'');h+='<label for="'+idf+'">'+esc(f[1])+'<select id="'+idf+'" name="'+k+'" required'+dis+'><option value="">Choose…</option>'+(S.data.accounts||[]).map(function(a){return opt(a.key,a.name||a.key,cur);}).join('')+'</select></label>';return;}
    if(col==='accounts'&&k==='key'&&id){h+='<label>'+esc(f[1])+'<input value="'+esc(v)+'" disabled></label>';return;}
    if(t==='area')h+='<label for="'+idf+'">'+esc(f[1])+'<textarea id="'+idf+'" name="'+k+'"'+dis+(k==='body'?' style="min-height:220px"':'')+'>'+esc(v)+'</textarea></label>';
    else if(t==='status')h+='<label for="'+idf+'">'+esc(f[1])+'<select id="'+idf+'" name="'+k+'"'+dis+'>'+ST[col].map(function(o){return opt(o[0],o[1],v||ST[col][0][0]);}).join('')+'</select></label>';
    else if(t.indexOf('select:')===0)h+='<label for="'+idf+'">'+esc(f[1])+'<select id="'+idf+'" name="'+k+'"'+dis+'>'+t.slice(7).split(',').map(function(o){return opt(o,o,v);}).join('')+'</select></label>';
    else if(t==='bool')h+='<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="'+idf+'" name="'+k+'"'+(v?' checked':'')+dis+'> '+esc(f[1])+'</label>';
    else h+='<label for="'+idf+'">'+esc(f[1])+'<input id="'+idf+'" name="'+k+'" type="'+(t==='date'?'date':'text')+'" value="'+esc(v)+'"'+dis+'></label>';
  });
  h+='</div>';
  if(!ro)h+='<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div>'+(id?'<button type="button" class="ghost" data-del style="color:var(--red)">Delete</button>':'')+'</div><div style="display:flex;gap:8px"><button type="button" data-close>Cancel</button><button class="primary" type="submit">'+(id?'Save':'Add')+'</button></div></div>';
  h+='</form>';
  sc.innerHTML=h;document.body.appendChild(sc);
  var form=sc.querySelector('form');
  var first=form.querySelector('input,textarea,select');if(first)first.focus();
  function close(){sc.remove();document.removeEventListener('keydown',onKey);}
  function onKey(e){if(e.key==='Escape')close();}
  document.addEventListener('keydown',onKey);
  sc.addEventListener('click',function(e){if(e.target===sc||e.target.closest('[data-close]'))close();});
  var delArmed=false;
  var del=form.querySelector('[data-del]');
  if(del)del.addEventListener('click',async function(){
    if(!delArmed){delArmed=true;del.textContent='Click again to delete';return;}
    if(await remove(col,id))close();
  });
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    var patch={};
    FIELDS[col].forEach(function(f){var el=form.elements[f[0]];if(!el||el.disabled)return;patch[f[0]]=f[2]==='bool'?el.checked:el.value.trim();});
    if(col!=='accounts'&&!patch.account){toast('Choose an account first.');return;}
    if(col==='accounts'){
      if(!id&&!/^[A-Za-z0-9_-]{2,30}$/.test(patch.key||'')){toast('Key must be 2–30 letters, digits, - or _.');return;}
      patch.contacts=(patch.contactsText||'').split('\n').map(function(l){l=l.trim();if(!l)return null;var m=l.split(/\s+—\s+|\s+-\s+/),rest=(m[1]||'').split(/,\s*/);return {name:m[0],role:rest[0]||'',org:rest[1]||''};}).filter(Boolean);
      patch.links=(patch.linksText||'').split('\n').map(function(l){l=l.trim();if(!l)return null;var p=l.split('|');return {label:(p[0]||'').trim(),url_or_path:(p[1]||'').trim()};}).filter(Boolean);
      delete patch.contactsText;delete patch.linksText;
    }
    if(col==='comms'&&patch.date&&!patch.when)patch.when=fmt(patch.date);
    var btn=form.querySelector('[type=submit]');btn.disabled=true;
    var ok=(col==='accounts'&&!id)?await createAccount(patch):await write(col,id||null,patch);
    if(ok){toast(id?'Saved.':'Added.');close();}else btn.disabled=false;
  });
}

  if(!d&&!n&&!b){toast('Write at least one line first.');return;}
  var body={done:d,next:n,blocked:b,at:new Date().toISOString(),account:S.acct==='all'?'':S.acct};if(S.me)body.author=S.me;
  try{await S.db.collection('updates').add(body);toast('Posted.');f.reset();}catch(err){toast('Couldn’t post. Try again.');}
});

function tick(){
  var el=document.getElementById('cd'),a=S.acct!=='all'?ACC(S.acct):null;
  if(!a||!a.nextMilestoneDate){el.hidden=true;return;}
  var ms=new Date(a.nextMilestoneDate+'T23:59:00').getTime()-Date.now();el.hidden=false;
  var d=Math.ceil(ms/86400000);
  el.textContent=(a.nextMilestone?String(a.nextMilestone).slice(0,28):'Milestone')+(d>=0?' · '+d+'d':' · passed');
  el.title=(a.nextMilestone||'')+' · '+fmt(a.nextMilestoneDate);
}
tick();setInterval(tick,60000);
var start=(location.hash||'').slice(1);
if(start==='all'){S.all=true;start='overview';}
if(start.indexOf('.')>0){S.acct=start.split('.')[0];start=start.split('.')[1];}
else{try{S.acct=localStorage.getItem('hub-acct')||'all';}catch(e){}}
if(!VIEWS[start]){try{start=localStorage.getItem('hub-tab')||'overview';}catch(e){start='overview';}}
S.tab=VIEWS[start]?start:'overview';
render();
boot();
})();
</script>
</body></html>
